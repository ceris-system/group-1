<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../../universal.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Emploc Monitoring Module</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --panel-bg: rgba(10, 15, 29, 0.85);
            --border-glow: rgba(0, 219, 255, 0.3);
            --accent-cyan: #f6f8f8;
            --accent-blue: #0291ff;
            --accent: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #8ca2c0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto Mono', monospace;
        }

        body {
            background-color: transparent;
            color: var(--text-main);
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .module-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-glow);
            background: rgba(2, 6, 15, 0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .client-name-display {
            font-size: 0.95rem;
            color: var(--accent);
            letter-spacing: 1px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 9px 15px;
            border-radius: 6px;
        }

        .module-title-badge {
            font-size: 0.95rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 9px 15px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 38px;
            background: rgba(0, 219, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 219, 255, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-cyan);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .total-hc-badge {
            background: rgba(0, 219, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .futuristic-refresh-btn {
            position: relative;
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .futuristic-refresh-btn:hover {
            background: rgba(0, 219, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 219, 255, 0.4);
        }

        .futuristic-refresh-btn i {
            transition: transform 0.6s ease;
        }

        .futuristic-refresh-btn.spinning i {
            transform: rotate(360deg);
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        th {
            background: rgb(2, 6, 15);
            color: var(--accent-cyan);
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(0, 219, 255, 0.04);
        }

        .eye-btn {
            background: rgba(2, 145, 255, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .eye-btn:hover {
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(2, 145, 255, 0.5);
        }

        .side-drawer {
            position: fixed;
            top: 0;
            right: -680px;
            width: 640px;
            height: 90%;
            background: #070b16;
            border-left: 1px solid var(--accent-cyan);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
            border-radius: 15px;
        }

        .side-drawer.open {
            right: 0;
        }

        .drawer-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 20px;
            border-bottom: 1px solid var(--border-glow);
            gap: 12px;
            position: relative;
        }

        .drawer-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .drawer-header h3 {
            color: #f52004;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .close-drawer {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .close-drawer:hover {
            color: var(--accent-cyan);
        }

        .drawer-body {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 15px;
            align-content: start;
            overflow-y: auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: span 2;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group .static-value-box {
            padding: 10px;
            background: rgb(10, 10, 10);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
            min-height: 41px;
            display: flex;
            align-items: center;
        }

        .form-group.remarks-group {
            grid-column: span 2;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .form-group.remarks-group textarea {
            width: 100%;
            flex: 1;
            min-height: 100px;
            padding: 12px;
            background: rgb(10, 10, 10);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            resize: none;
            box-sizing: border-box;
        }

        .form-group.remarks-group textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 219, 255, 0.2);
        }

        .drawer-footer {
            padding: 20px 30px;
            border-top: 1px solid var(--border-glow);
            display: flex;
            justify-content: center;
            background: #070b16;
        }

        .update-btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 219, 255, 0.4);
            transition: all 0.3s ease;
            border: none;
        }

        .update-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 25px rgba(0, 219, 255, 0.7);
        }

        #customAlertModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 29, 0.8);
            backdrop-filter: blur(5px);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }

        .custom-alert-box {
            width: 400px;
            max-width: 90vw;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--accent, #00f3ff);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            text-align: center;
            animation: modalPopIn 0.3s ease;
        }

        @keyframes modalPopIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .custom-alert-icon {
            font-size: 2.5rem;
            color: var(--accent, #00f3ff);
            margin-bottom: 15px;
        }

        .custom-alert-title {
            color: var(--accent, #00f3ff);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .custom-alert-message {
            color: var(--text-main);
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .custom-alert-btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 219, 255, 0.4);
            transition: all 0.3s ease;
        }

        .custom-alert-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 25px rgba(0, 219, 255, 0.7);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(2, 6, 15, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-glow);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="module-container">
        <div id="loader" style="display:none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 15, 29, 0.8); backdrop-filter: blur(5px); z-index: 999; text-align:center; padding-top:15vh;">
            <div class="glass-modal" style="display: inline-block; width: 350px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 12px; padding: 25px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);">
                <div style="position: relative; width: 100px; height: 100px; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center;">
                    <div style="position: absolute; width: 100%; height: 100%; border: 2px dashed rgba(0, 243, 255, 0.3); border-radius: 50%; animation: spin 10s linear infinite;"></div>
                    <div style="position: absolute; width: 80px; height: 80px; border: 3px solid transparent; border-top-color: var(--accent, #00f3ff); border-bottom-color: var(--accent, #00f3ff); border-radius: 50%; animation: spinReverse 2s linear infinite;"></div>
                    <div style="position: absolute; width: 60px; height: 60px; border: 2px dotted rgba(255, 255, 255, 0.4); border-radius: 50%; animation: spin 4s linear infinite;"></div>
                    <div style="width: 12px; height: 12px; background: #ffffff; border-radius: 50%; box-shadow: 0 0 15px var(--accent, #00f3ff);"></div>
                </div>
                <h4 id="loaderTitle" style="color: var(--accent, #00f3ff); margin: 0 0 15px 0; font-family: monospace; letter-spacing: 1px; font-size: 14px;">UPDATING SYSTEM DATABASE</h4>
                <div class="progress-wrapper" style="background: rgba(255, 255, 255, 0.1); border-radius: 6px; overflow: hidden; height: 8px; margin-bottom: 10px; border: 1px solid rgba(255, 255, 255, 0.05);">
                    <div id="initialBar" class="progress-fill" style="background: var(--accent, #00f3ff); width: 0%; height: 100%; transition: width 0.2s ease; box-shadow: 0 0 10px var(--accent, #00f3ff);"></div>
                </div>
                <span id="initialPercent" style="font-size: 12px; color: var(--accent, #00f3ff); font-family: monospace;">0%</span>
            </div>
        </div>

        <div class="module-header">
            <div class="header-left">
                <div class="client-name-display" id="clientNameDisplay" style="display: none;">---</div>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="filterSearch" placeholder="Filter search..." onkeyup="filterTableData()">
                </div>
                <div class="module-title-badge">HR EMPLOC MONITORING</div>
            </div>
            <div class="header-right">
                <div class="total-hc-badge">TOTAL HC: <span id="totalHCDisplay">0.00</span></div>
                <button class="futuristic-refresh-btn" id="refreshBtn" onclick="loadEmplocData()">
                    <i class="fa-solid fa-rotate"></i> REFRESH
                </button>
            </div>
        </div>
        <br>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>VCODE</th>
                        <th>FULLNAME</th>
                        <th>POSITION</th>
                        <th>DATE ONBOARD</th>
                        <th>AGING</th>
                        <th>OUTLET</th>
                        <th>HC</th>
                        <th>VIEW</th>
                    </tr>
                </thead>
                <tbody id="emplocTableBody">
                    <tr>
                        <td colspan="8" style="text-align: center; color: var(--text-muted);">Loading employee monitoring records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="side-drawer" id="sideDrawer">
        <div class="drawer-header">
            <div class="drawer-header-top">
                <h3>HR EMPLOC MONITORING</h3>
                <button class="close-drawer" onclick="closeSideDrawer()"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="drawer-body">
            <div class="form-group">
                <label>Vcode</label>
                <div id="valVcode" class="static-value-box">---</div>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <div id="valFullName" class="static-value-box">---</div>
            </div>
            <div class="form-group">
                <label>Position</label>
                <div id="valPosition" class="static-value-box">---</div>
            </div>
            <div class="form-group">
                <label>Date Onboard</label>
                <div id="valDateOnboard" class="static-value-box">---</div>
            </div>
            <div class="form-group full-width">
                <label>Outlet</label>
                <div id="valOutlet" class="static-value-box">---</div>
            </div>
            <div class="form-group full-width">
                <label>HC</label>
                <div id="valHc" class="static-value-box">---</div>
            </div>
            <div class="form-group remarks-group">
                <label>HRCO Remarks</label>
                <textarea id="drawerRemarks" placeholder="Enter HRCO Remarks"></textarea>
            </div>
        </div>
        <div class="drawer-footer">
            <button class="update-btn" onclick="updateEmplocRecord()">UPDATE RECORD</button>
        </div>
    </div>

    <div id="customAlertModal">
        <div class="custom-alert-box">
            <div class="custom-alert-icon" id="customAlertIcon"><i class="fa-solid fa-circle-info"></i></div>
            <div class="custom-alert-title" id="customAlertTitle">SYSTEM NOTIFICATION</div>
            <div class="custom-alert-message" id="customAlertMessage">Alert message goes here.</div>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <script>
        function getModuleApi() {
            if (window.parent && window.parent.API) return window.parent.API;
            if (window.API) return window.API;
            return "";
        }

        const urlParams = new URLSearchParams(window.location.search);
        const sheetID = urlParams.get('sheetID');
        const MODULE_API = getModuleApi();
        let globalEmplocData = [];
        let activeVcode = "";

        window.onload = function() {
            loadEmplocData();
        };

        function showCustomAlert(message, title = "SYSTEM NOTIFICATION", type = "info") {
            const modal = document.getElementById('customAlertModal');
            const msgEl = document.getElementById('customAlertMessage');
            const titleEl = document.getElementById('customAlertTitle');
            const iconEl = document.getElementById('customAlertIcon');

            msgEl.innerText = message;
            titleEl.innerText = title;
            if (type === 'success') {
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                iconEl.style.color = '#00f3ff';
            } else if (type === 'error') {
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
                iconEl.style.color = '#f52004';
            } else {
                iconEl.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
                iconEl.style.color = '#0291ff';
            }

            modal.style.display = 'flex';
        }

        function closeCustomAlert() {
            document.getElementById('customAlertModal').style.display = 'none';
        }

        function simulateProgress(onComplete, titleText = "UPDATING SYSTEM DATABASE") {
            const loader = document.getElementById('loader');
            const initialBar = document.getElementById('initialBar');
            const initialPercent = document.getElementById('initialPercent');
            const loaderTitle = document.getElementById('loaderTitle');
            
            loaderTitle.innerText = titleText;
            loader.style.display = 'block';
            initialBar.style.width = '100%';
            initialPercent.innerText = '100%';

            if (typeof onComplete === 'function') {
                onComplete(() => {
                    loader.style.display = 'none';
                });
            }
        }

        async function loadEmplocData() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.classList.add('spinning');
            simulateProgress(async (finishProgress) => {
                try {
                    const clientHeaderParam = urlParams.get('clientHeader') || "";
                    const searchFilterVal = document.getElementById('filterSearch').value || "";
                    
                    const parentAPI = MODULE_API || window.API;
                    if (!MODULE_API && !parentAPI) {
                        showCustomAlert("This module must be opened from the C.E.R.I.S dashboard.", "MODULE LOAD ERROR", "error");
                        return;
                    }
                    
                    const response = await fetch(`${parentAPI}?sheetID=${sheetID}&module=hr_emploc_monitoring&clientHeader=${encodeURIComponent(clientHeaderParam)}&filterQuery=${encodeURIComponent(searchFilterVal)}`);
                    const jsonResponse = await response.json();

                    if (jsonResponse.error) {
                        showCustomAlert("Error: " + jsonResponse.error, "DATABASE ERROR", "error");
                        finishProgress();
                        return;
                    }

                    const rawClientName = jsonResponse.clientHeader || clientHeaderParam || "";
                    const cleanedClientName = rawClientName.replace(/systm|system/gi, "").trim();
                    document.getElementById('clientNameDisplay').innerText = cleanedClientName || "---";

                    globalEmplocData = [];
                    const dataRows = jsonResponse.rows || [];

                    for (let i = 0; i < dataRows.length; i++) {
                        const r = dataRows[i];
                        const vcode = String(r[6] || "").trim(); // Col G
                        if (!vcode) continue;

                        let matches = false;

                        // Condition 1: If logged in as general "FOREVER DISER", look at Column AD (Index 29)
                        if (cleanedClientName.toUpperCase() === "FOREVER DISER") {
                            const colADValue = String(r[29] || "").replace(/[\r\n\u00A0]+/g, " ").replace(/\s+/g, " ").trim().toUpperCase();
                            matches = colADValue.includes("FOREVER");
                        } 
                        // Condition 2: If using a specific sub-cluster, look at Column B (Index 1)
                        else {
                            const colBValue = String(r[1] || "").replace(/[\r\n\u00A0]+/g, " ").replace(/\s+/g, " ").trim().toUpperCase();
                            matches = colBValue.includes(cleanedClientName.toUpperCase());
                        }

                        if (!matches) {
                            continue;
                        }

                        const hcVal = parseFloat(r[25]) || 0; // Col Z

                        globalEmplocData.push({
                            vcode: r[6] || "",       
                            fullName: r[10] || "",   
                            position: r[27] || "",   
                            dateOnboard: formatDisplayDate(r[21]), 
                            aging: r[23] || "",      
                            outlet: r[28] || "",     
                            hc: hcVal.toFixed(2),
                            rawHc: hcVal,
                            remarks: r[9] || ""      
                        });
                    }

                    renderTable(globalEmplocData);
                } catch (err) {
                    console.error("Failed to fetch records", err);
                    showCustomAlert("Failed to load records from server.", "NETWORK ERROR", "error");
                } finally {
                    finishProgress();
                    refreshBtn.classList.remove('spinning');
                }
            }, "LOADING HR EMPLOC MONITORING");
        }

        function formatDisplayDate(dateVal) {
            if (!dateVal || isNaN(Date.parse(dateVal))) return "---";
            const d = new Date(dateVal);
            return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        function renderTable(data) {
            const tbody = document.getElementById('emplocTableBody');
            let totalHC = 0;
            data.forEach(item => {
                totalHC += item.rawHc;
            });
            document.getElementById('totalHCDisplay').innerText = totalHC.toFixed(2);

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">No records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>${item.vcode}</td>
                    <td>${item.fullName}</td>
                    <td>${item.position}</td>
                    <td>${item.dateOnboard}</td>
                    <td>${item.aging}</td>
                    <td>${item.outlet}</td>
                    <td>${item.hc}</td>
                    <td><button class="eye-btn" onclick="openSideDrawer('${item.vcode}')"><i class="fa-solid fa-eye"></i></button></td>
                </tr>
            `).join('');
        }

        function filterTableData() {
            const query = document.getElementById('filterSearch').value.toLowerCase();
            const filtered = globalEmplocData.filter(item => 
                Object.values(item).some(val => String(val).toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        function openSideDrawer(vcode) {
            const record = globalEmplocData.find(item => item.vcode === vcode);
            if (!record) return;

            activeVcode = record.vcode;
            
            document.getElementById('valVcode').innerText = record.vcode || "---";
            document.getElementById('valFullName').innerText = record.fullName || "---";
            document.getElementById('valPosition').innerText = record.position || "---";
            document.getElementById('valDateOnboard').innerText = record.dateOnboard || "---";
            document.getElementById('valOutlet').innerText = record.outlet || "---";
            document.getElementById('valHc').innerText = record.hc || "0.00";
            
            document.getElementById('drawerRemarks').value = record.remarks || "";

            document.getElementById('sideDrawer').classList.add('open');
        }

        function closeSideDrawer() {
            document.getElementById('sideDrawer').classList.remove('open');
        }

        async function updateEmplocRecord() {
            const payload = {
                vcode: activeVcode,
                remarks: document.getElementById('drawerRemarks').value
            };
            simulateProgress(async (finishProgress) => {
                try {
                    const parentAPI = MODULE_API || window.API;
                    
                    const response = await fetch(`${parentAPI}?sheetID=${sheetID}&module=hr_emploc_monitoring&action=updaterecord`, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    
                    finishProgress();

                    if (result.status === 'success') {
                        showCustomAlert("Record Updated Successfully!", "SUCCESS", "success");
                        closeSideDrawer();
                        loadEmplocData();
                    } else {
                        showCustomAlert("Update failed: " + result.message, "UPDATE ERROR", "error");
                    }
                } catch (err) {
                    console.error("Update error", err);
                    finishProgress();
                    showCustomAlert("An error occurred during update.", "NETWORK ERROR", "error");
                }
            }, "UPDATING SYSTEM DATABASE");
        }
    </script>
</body>
</html>
